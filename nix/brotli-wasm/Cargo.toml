[package]
name = "saerskriven-brotli"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
saerskriven-brotli-codec = { path = "codec" }

[workspace]
members = ["codec"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
