threats:
  - id: b1a6332d-8def-4df9-922e-53718c920155
    number: 17
    title: Pilot container-role privilege escalation
    category:
      methodology: STRIDE
      category: elevation-of-privilege
    severity: high
    status: mitigated
    description: An attacker who compromises Pilot could use its standing container credentials.
    mitigation: Least-privilege IAM limits the role to s3:PutObject on the one bucket prefix. Pilot runs in its own container, separate from the proxy.
    elements:
      - f1646094-9885-422a-b7e7-7888c72905ef
  - id: 4b73d786-865e-43fc-b1bd-0e0bc75cae03
    number: 27
    title: Poisoned OSV payload exploits parser
    category:
      methodology: STRIDE
      category: denial-of-service
    severity: medium
    status: mitigated
    description: A maliciously crafted or unexpectedly massive OSV payload from upstream could cause Pilot to exhaust memory or crash during JSON parsing.
    mitigation: Pilot runs apart from the proxy. If Pilot runs out of memory or fails, it only delays updates. The proxy keeps serving traffic from the last-known-good osv.db snapshot.
    elements:
      - f1646094-9885-422a-b7e7-7888c72905ef
  - id: c87367bd-fc3f-4792-94b6-8db459011823
    number: 101
    title: Oracle Blackout / Supply Chain DoS via OSV.dev compromise
    category:
      methodology: STRIDE
      category: spoofing
    severity: high
    status: accepted-risk
    description: An attacker who gains control of osv.dev can push malicious vulnerability records. Those records trigger false positives, or fast-lane a malicious remediation package. The attack is strongest when the attacker also publishes a malicious package.
    mitigation: "Risk treatment: accepted by trust assumption. A compromised security oracle is a foundational supply-chain compromise. Pilot relies on OSV as a source of vulnerability truth. A hostile oracle defeats the defence outright. Transport, parsing, validation, and last-good-database controls mitigate tampering in transit, malformed payloads, and update outages. They cannot make a hostile source of truth trustworthy."
    elements:
      - f1646094-9885-422a-b7e7-7888c72905ef
