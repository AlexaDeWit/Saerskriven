# A cut-down of a model as Saerskriven v0.2.1 wrote it, before version 1 of
# the format gained a flow's `bidirectional` and an attached endpoint's
# `side`. Elements, threats and text were deleted from the real output by
# hand and nothing was added. Frozen: never regenerate it from the current
# writer. It is what holds the additive rule to its promise, that a file an
# earlier release wrote still reads, and the next additive key gets a file of
# the shape before it.
