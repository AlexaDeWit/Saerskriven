formatVersion: 2
metadata:
  title: Two diagrams
  owner: Alexandra de Wit
  description: A small shop drawn on two diagrams, with crowded flow names and a register that uses every record kind.
  contributors:
    - Alexandra de Wit
assumptions:
  - id: as-provider-certified
    prose: The payment provider holds its own card data certification.
    status: valid
    threats:
      - th-card-data
    appliesToModel: true
  - id: as-callback-signed
    prose: The card network signs every callback it sends.
    status: invalidated
    threats:
      - th-forged-callback
    appliesToModel: false
  - id: as-couriers-vetted
    prose: Every courier is vetted by the carrier.
    status: unconfirmed
    threats:
      - th-address-exposure
    appliesToModel: true
