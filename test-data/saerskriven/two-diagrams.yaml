mitigations:
  - id: mi-sign-in-throttle
    title: Sign-in throttling
    prose: |-
      Throttle sign-in attempts:

      - per account
      - per network address
    status: proposed
    threats:
      - th-account-takeover
  - id: mi-server-pricing
    title: ""
    prose: The server prices the basket from the catalogue and ignores any price the page sends.
    status: implemented
    threats:
      - th-basket-price
  - id: mi-signed-basket
    title: Signed basket
    prose: The basket token is signed, and a changed token is refused.
    status: verified
    threats:
      - th-basket-price
  - id: mi-ledger-audit
    title: ""
    prose: Write an audit entry with each ledger change.
    status: proposed
    threats:
      - th-order-denied
  - id: mi-reservation-expiry
    title: Reservation expiry
    prose: A reservation lapses after thirty minutes, and a hold outlives no reservation.
    status: implemented
    threats:
      - th-stock-hoarding
      - th-picker-override
threats:
  - id: th-account-takeover
    number: 1
    title: Account takeover by credential stuffing
    category:
      methodology: STRIDE
      category: spoofing
    severity: high
    status: open
    description: Reused passwords from another breach sign in as the shopper.
    elements:
      - el-shopper
      - el-browse
  - id: th-basket-price
    number: 2
    title: Basket price changed in the page
    category:
      methodology: STRIDE
      category: tampering
    severity: critical
    status: mitigated
    description: The page carries the price back with the basket, so an edited page could set its own.
    elements:
      - el-web-shop
      - el-page
  - id: th-draft-listings
    number: 3
    title: Unpublished listings readable
    category:
      methodology: CIA
      category: confidentiality
    severity: medium
    status: accepted-risk
    description: |-
      A guessed listing address shows a product before launch:

      - its draft price
      - its launch date
    elements:
      - el-catalogue
      - el-listings
  - id: th-card-data
    number: 4
    title: Card data disclosed in transit
    category:
      methodology: STRIDE
      category: information-disclosure
    severity: high
    status: transferred
    description: ""
    elements:
      - el-payment
      - el-charge
  - id: th-order-denied
    number: 6
    title: Shopper denies placing an order
    category:
      methodology: STRIDE
      category: repudiation
    severity: low
    status: mitigated
    description: ""
    elements:
      - el-ledger
      - el-record
  - id: th-forged-callback
    number: 7
    title: Forged payment callback
    category:
      methodology: custom
      methodologyName: Payments checklist
      category: Callback integrity
    severity: undecided
    status: open
    description: A callback that is not from the card network marks an order paid.
    elements:
      - el-callback
  - id: th-stock-hoarding
    number: 8
    title: Stock held by abandoned reservations
    category:
      methodology: STRIDE
      category: denial-of-service
    severity: medium
    status: open
    description: ""
    elements:
      - el-stock
      - el-reserve
  - id: th-address-exposure
    number: 9
    title: Courier learns more than the address
    category:
      methodology: LINDDUN
      category: data-disclosure
    severity: low
    status: open
    description: ""
    elements:
      - el-courier
      - el-hand-over
  - id: th-picker-override
    number: 10
    title: Picker overrides a dispatch hold
    category:
      methodology: STRIDE
      category: elevation-of-privilege
    severity: high
    status: open
    description: ""
    elements:
      - el-picker
      - el-dispatch
      - el-picked
  - id: th-refund-abuse
    number: 11
    title: Refund policy abused
    category:
      methodology: CIA
      category: integrity
    severity: low
    status: open
    description: "Not tied to one element: the policy itself is the weakness."
    elements: []
lastIssuedThreatNumber: 11
