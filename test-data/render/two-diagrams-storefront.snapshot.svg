<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 12 1267.75 536" width="1267.75" height="536"><title>Taking an order</title><rect x="-8" y="12" width="1267.75" height="536" fill="#F9F6F0"></rect><style>.saer-diagram-element {
  font-family: "Liberation Sans";
}
.saer-diagram-shape {
  fill: #FAF8F2;
  stroke: #38342E;
  stroke-width: 2;
}
.saer-diagram-actor {
  fill: #EAE5DA;
}
.saer-diagram-process {
  fill: #E7E9E1;
}
.saer-diagram-store {
  fill: none;
  stroke-width: 2.5;
}
.saer-diagram-boundary-box,
.saer-diagram-boundary-curve {
  fill: none;
  stroke: #6B655C;
  stroke-width: 2;
  stroke-dasharray: 8 6;
}
.saer-diagram-out-of-scope {
  opacity: 0.5;
}
.saer-diagram-out-of-scope .saer-diagram-shape {
  stroke-dasharray: 6 4;
}
.saer-diagram-label {
  fill: #38342E;
  font-size: 10px;
  font-weight: 500;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-note {
  fill: #6B655C;
  font-size: 12px;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-flow {
  fill: none;
}
.saer-diagram-flow-arrow {
  fill: #38342E;
  stroke: none;
}
.saer-diagram-flow-label {
  fill: #6B655C;
  font-size: 10px;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-flow-backing {
  fill: #F9F6F0;
  stroke: none;
}
.saer-diagram-badge {
  stroke: #FAF8F2;
  stroke-width: 3;
}
.saer-diagram-badge-count {
  fill: #FAF8F2;
  stroke: none;
  font-weight: 600;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-badge-primary .saer-diagram-badge-count {
  font-size: 11px;
}
.saer-diagram-badge-secondary .saer-diagram-badge-count {
  font-size: 9px;
}
.saer-diagram-badge-mark {
  fill: #FAF8F2;
  stroke: none;
  font-size: 9px;
  font-weight: 700;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-badge-flag {
  stroke-linejoin: round;
}
.saer-diagram-tone-critical {
  fill: #C14339;
}
.saer-diagram-tone-high {
  fill: #A85E1D;
}
.saer-diagram-tone-medium {
  fill: #46788A;
}
.saer-diagram-tone-low {
  fill: #4B6B50;
}
.saer-diagram-tone-neutral {
  fill: #756E63;
}
.saer-diagram-tone-flag {
  fill: #38342E;
}

.saer-diagram-tone-low { fill: #4B6B50; stroke: #4B6B50; stroke-width: 3; }
.saer-diagram-tone-low ~ .saer-diagram-badge-count, .saer-diagram-tone-low ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-medium { fill: #46788A; stroke: #46788A; stroke-width: 3; }
.saer-diagram-tone-medium ~ .saer-diagram-badge-count, .saer-diagram-tone-medium ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-high { fill: #A85E1D; stroke: #A85E1D; stroke-width: 3; }
.saer-diagram-tone-high ~ .saer-diagram-badge-count, .saer-diagram-tone-high ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-critical { fill: #C14339; stroke: #C14339; stroke-width: 3; }
.saer-diagram-tone-critical ~ .saer-diagram-badge-count, .saer-diagram-tone-critical ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-neutral { fill: #756E63; stroke: #756E63; stroke-width: 3; }
.saer-diagram-tone-neutral ~ .saer-diagram-badge-count, .saer-diagram-tone-neutral ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-flag { fill: #38342E; stroke: #38342E; stroke-width: 3; }
.saer-diagram-tone-flag ~ .saer-diagram-badge-count, .saer-diagram-tone-flag ~ .saer-diagram-badge-mark { fill: #FAF8F2; }</style><g transform="translate(300, 20)"><g class="saer-diagram-element"><rect class="saer-diagram-shape saer-diagram-boundary-box" width="560" height="520"></rect><text class="saer-diagram-label" x="280" y="11"><tspan x="280" dy="0">Shop network</tspan></text></g></g><g transform="translate(0, 220)"><g class="saer-diagram-element"><rect class="saer-diagram-shape saer-diagram-actor" width="140" height="80"></rect><text class="saer-diagram-label" x="70" y="40"><tspan x="70" dy="0">Shopper</tspan></text><g class="saer-diagram-badge" transform="translate(140, 0)"><g class="saer-diagram-badge-primary"><circle class="saer-diagram-tone-high" r="13"></circle><text class="saer-diagram-badge-count" y="-3">1</text><text class="saer-diagram-badge-mark" y="7.5">H</text></g></g></g></g><g transform="translate(460, 200)"><g class="saer-diagram-element"><ellipse class="saer-diagram-shape saer-diagram-process" cx="70" cy="70" rx="70" ry="70"></ellipse><text class="saer-diagram-label" x="70" y="70"><tspan x="70" dy="0">Web shop</tspan></text></g></g><g transform="translate(680, 60)"><g class="saer-diagram-element"><line class="saer-diagram-shape saer-diagram-store" x1="0" y1="0" x2="150" y2="0"></line><line class="saer-diagram-shape saer-diagram-store" x1="0" y1="80" x2="150" y2="80"></line><text class="saer-diagram-label" x="75" y="40"><tspan x="75" dy="0">Catalogue</tspan></text></g></g><g transform="translate(680, 420)"><g class="saer-diagram-element"><line class="saer-diagram-shape saer-diagram-store" x1="0" y1="0" x2="150" y2="0"></line><line class="saer-diagram-shape saer-diagram-store" x1="0" y1="80" x2="150" y2="80"></line><text class="saer-diagram-label" x="75" y="40"><tspan x="75" dy="0">Order ledger</tspan></text><g class="saer-diagram-badge" transform="translate(150, 0)"><g class="saer-diagram-badge-flag" transform="translate(0, 0)"><path class="saer-diagram-tone-flag" d="M 0 -11 L 11 11 L -11 11 Z"></path><text class="saer-diagram-badge-mark" y="4">!</text></g></g></g></g><g transform="translate(1040, 200)"><g class="saer-diagram-element saer-diagram-out-of-scope"><ellipse class="saer-diagram-shape saer-diagram-process" cx="70" cy="70" rx="70" ry="70"></ellipse><text class="saer-diagram-label" x="70" y="63.75"><tspan x="70" dy="0">Payment</tspan><tspan x="70" dy="12.5">gateway</tspan></text></g></g><g transform="translate(0, 420)"><g class="saer-diagram-element"><text class="saer-diagram-note" x="100" y="37.5"><tspan x="100" dy="0">Card numbers never reach the</tspan><tspan x="100" dy="15">shop.</tspan></text></g></g><g class="saer-diagram-element"><path class="saer-diagram-shape saer-diagram-flow" d="M 140 260 L 460 270"></path><path class="saer-diagram-flow-arrow" d="M 460 270 L 441.79 276.434 L 442.227 262.441 Z"></path><rect class="saer-diagram-flow-backing" x="206.56" y="202.578" width="93" height="55.5"></rect><g class="saer-diagram-badge" transform="translate(223.56, 230.328)"><g class="saer-diagram-badge-primary"><circle class="saer-diagram-tone-high" r="13"></circle><text class="saer-diagram-badge-count" y="-3">1</text><text class="saer-diagram-badge-mark" y="7.5">H</text></g></g><text class="saer-diagram-flow-label" x="268.06" y="211.578"><tspan x="268.06" dy="0">browse the</tspan><tspan x="268.06" dy="12.5">catalogue</tspan><tspan x="268.06" dy="12.5">and fill a</tspan><tspan x="268.06" dy="12.5">basket</tspan></text></g><g class="saer-diagram-element"><path class="saer-diagram-shape saer-diagram-flow" d="M 460 270 L 140 260"></path><path class="saer-diagram-flow-arrow" d="M 140 260 L 158.21 253.566 L 157.773 267.559 Z"></path><rect class="saer-diagram-flow-backing" x="302.439" y="243.074" width="140" height="18"></rect><text class="saer-diagram-flow-label" x="372.439" y="252.074"><tspan x="372.439" dy="0">return the rendered page</tspan></text></g><g class="saer-diagram-element"><path class="saer-diagram-shape saer-diagram-flow" d="M 600 270 L 680 100"></path><path class="saer-diagram-flow-arrow" d="M 680 100 L 678.669 119.267 L 666.002 113.306 Z"></path><rect class="saer-diagram-flow-backing" x="567.25" y="176" width="145.5" height="18"></rect><text class="saer-diagram-flow-label" x="640" y="185"><tspan x="640" dy="0">read the product listings</tspan></text></g><g class="saer-diagram-element"><path class="saer-diagram-shape saer-diagram-flow" d="M 600 270 L 1040 270"></path><path class="saer-diagram-flow-arrow" d="M 1040 270 L 1022 277 L 1022 263 Z"></path><rect class="saer-diagram-flow-backing" x="750.5" y="235.5" width="107" height="30.5"></rect><text class="saer-diagram-flow-label" x="804" y="244.5"><tspan x="804" dy="0">authorise the card</tspan><tspan x="804" dy="12.5">payment</tspan></text></g><g class="saer-diagram-element"><path class="saer-diagram-shape saer-diagram-flow" d="M 1040 270 L 600 270"></path><path class="saer-diagram-flow-arrow" d="M 600 270 L 618 263 L 618 277 Z"></path><rect class="saer-diagram-flow-backing" x="863.25" y="248" width="145.5" height="18"></rect><text class="saer-diagram-flow-label" x="936" y="257"><tspan x="936" dy="0">confirm the authorisation</tspan></text></g><g class="saer-diagram-element"><path class="saer-diagram-shape saer-diagram-flow" d="M 530 340 L 530 460 L 680 460"></path><path class="saer-diagram-flow-arrow" d="M 680 460 L 662 467 L 662 453 Z"></path><rect class="saer-diagram-flow-backing" x="498.25" y="445" width="149.5" height="30"></rect><g class="saer-diagram-badge" transform="translate(513.25, 460)"><g class="saer-diagram-badge-flag" transform="translate(0, 0)"><path class="saer-diagram-tone-flag" d="M 0 -11 L 11 11 L -11 11 Z"></path><text class="saer-diagram-badge-mark" y="4">!</text></g></g><text class="saer-diagram-flow-label" x="586" y="460"><tspan x="586" dy="0">record the paid order</tspan></text></g><g class="saer-diagram-element"><path class="saer-diagram-shape saer-diagram-flow" d="M 1240 480 L 1110 340"></path><path class="saer-diagram-flow-arrow" d="M 1110 340 L 1127.378 348.427 L 1117.119 357.953 Z"></path><rect class="saer-diagram-flow-backing" x="1098.25" y="380.5" width="153.5" height="59"></rect><g class="saer-diagram-badge" transform="translate(1115.25, 397.5)"><g class="saer-diagram-badge-primary"><circle class="saer-diagram-tone-neutral" r="13"></circle><text class="saer-diagram-badge-count" y="-3">1</text><text class="saer-diagram-badge-mark" y="7.5">?</text></g><g class="saer-diagram-badge-flag" transform="translate(0, 27)"><path class="saer-diagram-tone-flag" d="M 0 -11 L 11 11 L -11 11 Z"></path><text class="saer-diagram-badge-mark" y="4">!</text></g></g><text class="saer-diagram-flow-label" x="1190" y="397.5"><tspan x="1190" dy="0">card network callback</tspan></text></g></svg>
