<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -21 669 539" width="669" height="539"><title>Main data flow</title><rect x="-8" y="-21" width="669" height="539" fill="#F9F6F0"></rect><style>.saer-diagram-element {
  font-family: "Liberation Sans";
}
.saer-diagram-shape {
  fill: #FAF8F2;
  stroke: #38342E;
  stroke-width: 2;
}
.saer-diagram-actor {
  fill: #EAE5DA;
}
.saer-diagram-process {
  fill: #E7E9E1;
}
.saer-diagram-store {
  fill: none;
  stroke-width: 2.5;
}
.saer-diagram-boundary-box,
.saer-diagram-boundary-curve {
  fill: none;
  stroke: #6B655C;
  stroke-width: 2;
  stroke-dasharray: 8 6;
}
.saer-diagram-note-frame {
  fill: none;
}
.saer-diagram-label {
  fill: #38342E;
  font-size: 10px;
  font-weight: 500;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-note {
  fill: #6B655C;
  font-size: 12px;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-flow {
  fill: none;
}
.saer-diagram-flow-arrow {
  fill: #38342E;
  stroke: none;
}
.saer-diagram-flow-label {
  fill: #6B655C;
  font-size: 10px;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-flow-backing {
  fill: #F9F6F0;
  stroke: none;
}
.saer-diagram-out-of-scope .saer-diagram-shape {
  stroke: #6B655C;
  stroke-dasharray: 0 5;
  stroke-linecap: round;
}
.saer-diagram-out-of-scope .saer-diagram-flow-arrow {
  fill: #6B655C;
}
.saer-diagram-badge {
  stroke: #FAF8F2;
  stroke-width: 3;
}
.saer-diagram-badge-count {
  fill: #FAF8F2;
  stroke: none;
  font-weight: 600;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-badge-primary .saer-diagram-badge-count {
  font-size: 11px;
}
.saer-diagram-badge-secondary .saer-diagram-badge-count {
  font-size: 9px;
}
.saer-diagram-badge-mark {
  fill: #FAF8F2;
  stroke: none;
  font-size: 9px;
  font-weight: 700;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-badge-flag {
  stroke-linejoin: round;
}
.saer-diagram-tone-critical {
  fill: #C14339;
}
.saer-diagram-tone-high {
  fill: #A85E1D;
}
.saer-diagram-tone-medium {
  fill: #46788A;
}
.saer-diagram-tone-low {
  fill: #4B6B50;
}
.saer-diagram-tone-neutral {
  fill: #756E63;
}
.saer-diagram-tone-flag {
  fill: #38342E;
}

.saer-diagram-tone-low { fill: #4B6B50; stroke: #4B6B50; stroke-width: 3; }
.saer-diagram-tone-low ~ .saer-diagram-badge-count, .saer-diagram-tone-low ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-medium { fill: #46788A; stroke: #46788A; stroke-width: 3; }
.saer-diagram-tone-medium ~ .saer-diagram-badge-count, .saer-diagram-tone-medium ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-high { fill: #A85E1D; stroke: #A85E1D; stroke-width: 3; }
.saer-diagram-tone-high ~ .saer-diagram-badge-count, .saer-diagram-tone-high ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-critical { fill: #C14339; stroke: #C14339; stroke-width: 3; }
.saer-diagram-tone-critical ~ .saer-diagram-badge-count, .saer-diagram-tone-critical ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-neutral { fill: #756E63; stroke: #756E63; stroke-width: 3; }
.saer-diagram-tone-neutral ~ .saer-diagram-badge-count, .saer-diagram-tone-neutral ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-flag { fill: #38342E; stroke: #38342E; stroke-width: 3; }
.saer-diagram-tone-flag ~ .saer-diagram-badge-count, .saer-diagram-tone-flag ~ .saer-diagram-badge-mark { fill: #FAF8F2; }</style><g transform="translate(0, 0)"><g class="saer-diagram-element"><rect class="saer-diagram-shape saer-diagram-boundary-box" width="640" height="260"></rect><text class="saer-diagram-label" x="320" y="11"><tspan x="320" dy="0">Service perimeter</tspan></text><g class="saer-diagram-badge" transform="translate(640, 0)"><g class="saer-diagram-badge-primary"><circle class="saer-diagram-tone-neutral" r="13"></circle><text class="saer-diagram-badge-count" y="-3">1</text><text class="saer-diagram-badge-mark" y="7.5">?</text></g></g></g></g><g transform="translate(298, 298)"><g class="saer-diagram-element"><path class="saer-diagram-shape saer-diagram-boundary-curve" d="M 2 2 C 22 8.667 82 42 122 42 C 162 42 222 8.667 242 2"></path><text class="saer-diagram-label" x="122" y="61"><tspan x="122" dy="0">Edge zone</tspan></text><g class="saer-diagram-badge" transform="translate(244, 0)"><g class="saer-diagram-badge-flag" transform="translate(0, 0)"><path class="saer-diagram-tone-flag" d="M 0 -11 L 11 11 L -11 11 Z"></path><text class="saer-diagram-badge-mark" y="4">!</text></g></g></g></g><g transform="translate(300, 430)"><g class="saer-diagram-element saer-diagram-out-of-scope"><rect class="saer-diagram-shape saer-diagram-boundary-box" width="240" height="80"></rect><text class="saer-diagram-label" x="120" y="11"><tspan x="120" dy="0">Partner network</tspan></text></g></g><g transform="translate(40, 60)"><g class="saer-diagram-element"><rect class="saer-diagram-shape saer-diagram-actor" width="160" height="80"></rect><text class="saer-diagram-label" x="80" y="33.75"><tspan x="80" dy="0">Customer</tspan><tspan x="80" dy="12.5">browser</tspan></text><g class="saer-diagram-badge" transform="translate(160, 0)"><g class="saer-diagram-badge-primary"><circle class="saer-diagram-tone-critical" r="13"></circle><text class="saer-diagram-badge-count" y="-3">1</text><text class="saer-diagram-badge-mark" y="7.5">C</text></g></g></g></g><g transform="translate(280, 60)"><g class="saer-diagram-element"><ellipse class="saer-diagram-shape saer-diagram-process" cx="60" cy="60" rx="60" ry="60"></ellipse><text class="saer-diagram-label" x="60" y="60"><tspan x="60" dy="0">Order API</tspan></text><g class="saer-diagram-badge" transform="translate(120, 0)"><g class="saer-diagram-badge-primary"><circle class="saer-diagram-tone-high" r="13"></circle><text class="saer-diagram-badge-count" y="-3">2</text><text class="saer-diagram-badge-mark" y="7.5">H</text></g><g class="saer-diagram-badge-secondary" transform="translate(0, 25)"><circle class="saer-diagram-tone-neutral" r="9"></circle><text class="saer-diagram-badge-count">1</text></g></g></g></g><g transform="translate(460, 60)"><g class="saer-diagram-element saer-diagram-out-of-scope"><line class="saer-diagram-shape saer-diagram-store" x1="0" y1="0" x2="160" y2="0"></line><line class="saer-diagram-shape saer-diagram-store" x1="0" y1="80" x2="160" y2="80"></line><text class="saer-diagram-label" x="80" y="40"><tspan x="80" dy="0">Order database</tspan></text><g class="saer-diagram-badge" transform="translate(160, 0)"><g class="saer-diagram-badge-primary"><circle class="saer-diagram-tone-medium" r="13"></circle><text class="saer-diagram-badge-count" y="-3">1</text><text class="saer-diagram-badge-mark" y="7.5">M</text></g></g></g></g><g transform="translate(40, 320)"><g class="saer-diagram-element"><text class="saer-diagram-note" x="100" y="37.5"><tspan x="100" dy="0">Orders are kept for seven</tspan><tspan x="100" dy="15">years.</tspan></text></g></g><g transform="translate(43, 433)"><g class="saer-diagram-element saer-diagram-out-of-scope"><rect class="saer-diagram-shape saer-diagram-note-frame" x="-3" y="-3" width="200" height="80"></rect><text class="saer-diagram-note" x="97" y="29.5"><tspan x="97" dy="0">Backups are the provider&#x27;s</tspan><tspan x="97" dy="15">to review.</tspan></text></g></g><g class="saer-diagram-element"><path class="saer-diagram-shape saer-diagram-flow" d="M 200 100 L 240 100 L 280 120"></path><path class="saer-diagram-flow-arrow" d="M 280 120 L 260.77 118.211 L 267.031 105.689 Z"></path><path class="saer-diagram-flow-arrow" d="M 200 100 L 218 93 L 218 107 Z"></path><rect class="saer-diagram-flow-backing" x="208.811" y="124.378" width="71" height="34"></rect><g class="saer-diagram-badge" transform="translate(225.811, 141.378)"><g class="saer-diagram-badge-primary"><circle class="saer-diagram-tone-low" r="13"></circle><text class="saer-diagram-badge-count" y="-3">1</text><text class="saer-diagram-badge-mark" y="7.5">L</text></g></g><text class="saer-diagram-flow-label" x="259.311" y="135.128"><tspan x="259.311" dy="0">Submit</tspan><tspan x="259.311" dy="12.5">order</tspan></text></g><g class="saer-diagram-element"><path class="saer-diagram-shape saer-diagram-flow" d="M 400 120 L 460 100"></path><path class="saer-diagram-flow-arrow" d="M 460 100 L 445.137 112.333 L 440.71 99.051 Z"></path><rect class="saer-diagram-flow-backing" x="416.019" y="68.111" width="35.5" height="30.5"></rect><text class="saer-diagram-flow-label" x="433.769" y="77.111"><tspan x="433.769" dy="0">Store</tspan><tspan x="433.769" dy="12.5">order</tspan></text></g><g class="saer-diagram-element"><path class="saer-diagram-shape saer-diagram-flow" d="M 620 320 L 540 140"></path><path class="saer-diagram-flow-arrow" d="M 540 140 L 553.707 153.606 L 540.914 159.292 Z"></path><rect class="saer-diagram-flow-backing" x="491.379" y="167.603" width="148" height="59"></rect><g class="saer-diagram-badge" transform="translate(508.379, 184.603)"><g class="saer-diagram-badge-primary"><circle class="saer-diagram-tone-medium" r="13"></circle><text class="saer-diagram-badge-count" y="-3">1</text><text class="saer-diagram-badge-mark" y="7.5">M</text></g><g class="saer-diagram-badge-flag" transform="translate(0, 27)"><path class="saer-diagram-tone-flag" d="M 0 -11 L 11 11 L -11 11 Z"></path><text class="saer-diagram-badge-mark" y="4">!</text></g></g><text class="saer-diagram-flow-label" x="580.379" y="184.603"><tspan x="580.379" dy="0">Nightly backup probe</tspan></text></g></svg>
