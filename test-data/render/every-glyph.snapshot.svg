<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -21 669 439" width="669" height="439"><title>Main data flow</title><rect x="-8" y="-21" width="669" height="439" fill="#F9F6F0"></rect><style>.saer-element {
  font-family: "Liberation Sans";
}
.saer-shape {
  fill: #FAF8F2;
  stroke: #38342E;
  stroke-width: 2;
}
.saer-actor {
  fill: #EAE5DA;
}
.saer-process {
  fill: #E7E9E1;
}
.saer-store {
  fill: none;
  stroke-width: 2.5;
}
.saer-boundary-box,
.saer-boundary-curve {
  fill: none;
  stroke: #6B655C;
  stroke-width: 2;
  stroke-dasharray: 8 6;
}
.saer-out-of-scope {
  opacity: 0.5;
}
.saer-out-of-scope .saer-shape {
  stroke-dasharray: 6 4;
}
.saer-label {
  fill: #38342E;
  font-size: 10px;
  font-weight: 500;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-note {
  fill: #6B655C;
  font-size: 12px;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-flow {
  fill: none;
}
.saer-flow-arrow {
  fill: #38342E;
  stroke: none;
}
.saer-flow-label {
  fill: #6B655C;
  font-size: 10px;
  text-anchor: middle;
  dominant-baseline: central;
  paint-order: stroke;
  stroke: #F9F6F0;
  stroke-width: 3;
  stroke-linejoin: round;
}
.saer-diagram-badge {
  stroke: #FAF8F2;
  stroke-width: 3;
}
.saer-diagram-badge-count {
  fill: #FAF8F2;
  stroke: none;
  font-weight: 600;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-badge-primary .saer-diagram-badge-count {
  font-size: 11px;
}
.saer-diagram-badge-secondary .saer-diagram-badge-count {
  font-size: 9px;
}
.saer-diagram-badge-mark {
  fill: #FAF8F2;
  stroke: none;
  font-size: 9px;
  font-weight: 700;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-badge-flag {
  stroke-linejoin: round;
}
.saer-tone-critical {
  fill: #C14339;
}
.saer-tone-high {
  fill: #A85E1D;
}
.saer-tone-medium {
  fill: #46788A;
}
.saer-tone-low {
  fill: #4B6B50;
}
.saer-tone-neutral {
  fill: #756E63;
}
.saer-tone-flag {
  fill: #38342E;
}

.saer-tone-low { fill: #4B6B50; stroke: #4B6B50; stroke-width: 3; }
.saer-tone-low ~ .saer-diagram-badge-count, .saer-tone-low ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-tone-medium { fill: #46788A; stroke: #46788A; stroke-width: 3; }
.saer-tone-medium ~ .saer-diagram-badge-count, .saer-tone-medium ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-tone-high { fill: #A85E1D; stroke: #A85E1D; stroke-width: 3; }
.saer-tone-high ~ .saer-diagram-badge-count, .saer-tone-high ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-tone-critical { fill: #C14339; stroke: #C14339; stroke-width: 3; }
.saer-tone-critical ~ .saer-diagram-badge-count, .saer-tone-critical ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-tone-neutral { fill: #756E63; stroke: #756E63; stroke-width: 3; }
.saer-tone-neutral ~ .saer-diagram-badge-count, .saer-tone-neutral ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-tone-flag { fill: #38342E; stroke: #38342E; stroke-width: 3; }
.saer-tone-flag ~ .saer-diagram-badge-count, .saer-tone-flag ~ .saer-diagram-badge-mark { fill: #FAF8F2; }</style><g transform="translate(0, 0)"><g class="saer-element"><rect class="saer-shape saer-boundary-box" width="640" height="260"></rect><text class="saer-label" x="320" y="11"><tspan x="320" dy="0">Service perimeter</tspan></text><g class="saer-diagram-badge" transform="translate(640, 0)"><g class="saer-diagram-badge-primary"><circle class="saer-tone-neutral" r="13"></circle><text class="saer-diagram-badge-count" y="-3">1</text><text class="saer-diagram-badge-mark" y="7.5">?</text></g></g></g></g><g transform="translate(298, 298)"><g class="saer-element"><path class="saer-shape saer-boundary-curve" d="M 2 2 C 22 8.667 82 42 122 42 C 162 42 222 8.667 242 2"></path><text class="saer-label" x="122" y="61"><tspan x="122" dy="0">Edge zone</tspan></text><g class="saer-diagram-badge" transform="translate(244, 0)"><g class="saer-diagram-badge-flag" transform="translate(0, 0)"><path class="saer-tone-flag" d="M 0 -11 L 11 11 L -11 11 Z"></path><text class="saer-diagram-badge-mark" y="4">!</text></g></g></g></g><g transform="translate(40, 60)"><g class="saer-element"><rect class="saer-shape saer-actor" width="160" height="80"></rect><text class="saer-label" x="80" y="33.75"><tspan x="80" dy="0">Customer</tspan><tspan x="80" dy="12.5">browser</tspan></text><g class="saer-diagram-badge" transform="translate(160, 0)"><g class="saer-diagram-badge-primary"><circle class="saer-tone-critical" r="13"></circle><text class="saer-diagram-badge-count" y="-3">1</text><text class="saer-diagram-badge-mark" y="7.5">C</text></g></g></g></g><g transform="translate(280, 60)"><g class="saer-element"><circle class="saer-shape saer-process" cx="60" cy="60" r="60"></circle><text class="saer-label" x="60" y="60"><tspan x="60" dy="0">Order API</tspan></text><g class="saer-diagram-badge" transform="translate(120, 0)"><g class="saer-diagram-badge-primary"><circle class="saer-tone-high" r="13"></circle><text class="saer-diagram-badge-count" y="-3">2</text><text class="saer-diagram-badge-mark" y="7.5">H</text></g><g class="saer-diagram-badge-secondary" transform="translate(0, 25)"><circle class="saer-tone-neutral" r="9"></circle><text class="saer-diagram-badge-count">1</text></g></g></g></g><g transform="translate(460, 60)"><g class="saer-element saer-out-of-scope"><line class="saer-shape saer-store" x1="0" y1="0" x2="160" y2="0"></line><line class="saer-shape saer-store" x1="0" y1="80" x2="160" y2="80"></line><text class="saer-label" x="80" y="40"><tspan x="80" dy="0">Order database</tspan></text><g class="saer-diagram-badge" transform="translate(160, 0)"><g class="saer-diagram-badge-primary"><circle class="saer-tone-medium" r="13"></circle><text class="saer-diagram-badge-count" y="-3">1</text><text class="saer-diagram-badge-mark" y="7.5">M</text></g></g></g></g><g transform="translate(40, 320)"><g class="saer-element"><text class="saer-note" x="100" y="37.5"><tspan x="100" dy="0">Orders are kept for seven</tspan><tspan x="100" dy="15">years.</tspan></text></g></g><g class="saer-element"><path class="saer-shape saer-flow" d="M 200 100 L 240 100 L 280 120"></path><path class="saer-flow-arrow" d="M 280 120 L 260.77 118.211 L 267.031 105.689 Z"></path><path class="saer-flow-arrow" d="M 200 100 L 218 93 L 218 107 Z"></path><text class="saer-flow-label" x="235.139" y="134.722"><tspan x="235.139" dy="0">Submit order</tspan></text><g class="saer-diagram-badge" transform="translate(264.061, 76.878)"><g class="saer-diagram-badge-primary"><circle class="saer-tone-low" r="13"></circle><text class="saer-diagram-badge-count" y="-3">1</text><text class="saer-diagram-badge-mark" y="7.5">L</text></g></g></g><g class="saer-element"><path class="saer-shape saer-flow" d="M 400 120 L 460 100"></path><path class="saer-flow-arrow" d="M 460 100 L 445.137 112.333 L 440.71 99.051 Z"></path><text class="saer-flow-label" x="443.379" y="150.138"><tspan x="443.379" dy="0">Store order</tspan></text></g><g class="saer-element"><path class="saer-shape saer-flow" d="M 620 320 L 540 140"></path><path class="saer-flow-arrow" d="M 540 140 L 553.707 153.606 L 540.914 159.292 Z"></path><text class="saer-flow-label" x="499.423" y="211.923"><tspan x="499.423" dy="0">Nightly backup probe</tspan></text><g class="saer-diagram-badge" transform="translate(597.752, 168.221)"><g class="saer-diagram-badge-primary"><circle class="saer-tone-medium" r="13"></circle><text class="saer-diagram-badge-count" y="-3">1</text><text class="saer-diagram-badge-mark" y="7.5">M</text></g><g class="saer-diagram-badge-flag" transform="translate(0, 27)"><path class="saer-tone-flag" d="M 0 -11 L 11 11 L -11 11 Z"></path><text class="saer-diagram-badge-mark" y="4">!</text></g></g></g></svg>
