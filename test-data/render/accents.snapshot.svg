nt.</tspan></text></g></g><g class="saer-diagram-element saer-diagram-accent-1 saer-diagram-accent-strong"><path class="saer-diagram-shape saer-diagram-flow" d="M 200 95 L 320 95"></path><path class="saer-diagram-flow-arrow" d="M 320 95 L 302 102 L 302 88 Z"></path><rect class="saer-diagram-flow-backing" x="217.75" y="86" width="68.5" height="18"></rect><text class="saer-diagram-flow-label" x="252" y="95"><tspan x="252" dy="0">Strong flow</tspan></text></g><g class="saer-diagram-element saer-diagram-accent-4 saer-diagram-accent-strong"><path class="saer-diagram-shape saer-diagram-flow" d="M 720 95 L 840 95"></path><path class="saer-diagram-flow-arrow" d="M 840 95 L 822 102 L 822 88 Z"></path><path class="saer-diagram-flow-arrow" d="M 720 95 L 738 88 L 738 102 Z"></path><rect class="saer-diagram-flow-backing" x="729.25" y="67" width="101.5" height="18"></rect><text class="saer-diagram-flow-label" x="780" y="76"><tspan x="780" dy="0">Strong, both ways</tspan></text></g><g class="saer-diagram-element saer-diagram-accent-3"><path class="saer-diagram-shape saer-diagram-flow" d="M 200 295 L 320 295"></path><path class="saer-diagram-flow-arrow" d="M 320 295 L 302 302 L 302 288 Z"></path><rect class="saer-diagram-flow-backing" x="224.5" y="286" width="63" height="18"></rect><text class="saer-diagram-flow-label" x="256" y="295"><tspan x="256" dy="0">Light flow</tspan></text></g><g class="saer-diagram-element saer-diagram-accent-1"><path class="saer-diagram-shape saer-diagram-flow" d="M 720 295 L 840 295"></path><path class="saer-diagram-flow-arrow" d="M 840 295 L 822 302 L 822 288 Z"></path><rect class="saer-diagram-flow-backing" x="722.75" y="257" width="98.5" height="34"></rect><g class="saer-diagram-badge" transform="translate(739.75, 274)"><g class="saer-diagram-badge-primary"><circle class="saer-diagram-tone-critical" r="13"></circle><text class="saer-diagram-badge-count" y="-3">1</text><text class="saer-diagram-badge-mark" y="7.5">C</text></g></g><text class="saer-diagram-flow-label" x="787" y="267.75"><tspan x="787" dy="0">Light, with</tspan><tspan x="787" dy="12.5">a threat</tspan></text></g><g class="saer-diagram-element"><path class="saer-diagram-shape saer-diagram-flow" d="M 200 515 L 320 515"></path><path class="saer-diagram-flow-arrow" d="M 320 515 L 302 522 L 302 508 Z"></path><rect class="saer-diagram-flow-backing" x="231.25" y="506" width="57.5" height="18"></rect><text class="saer-diagram-flow-label" x="260" y="515"><tspan x="260" dy="0">No accent</tspan></text></g><g class="saer-diagram-element saer-diagram-out-of-scope saer-diagram-accent-2 saer-diagram-accent-strong"><path class="saer-diagram-shape saer-diagram-flow" d="M 720 515 L 840 515"></path><path class="saer-diagram-flow-arrow" d="M 840 515 L 822 522 L 822 508 Z"></path><rect class="saer-diagram-flow-backing" x="721" y="487" width="118" height="18"></rect><text class="saer-diagram-flow-label" x="780" y="496"><tspan x="780" dy="0">Out of scope, strong</tspan></text></g></svg>
