<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 132 723 256" width="723" height="256"><title>High level</title><rect x="32" y="132" width="723" height="256" fill="#F9F6F0"></rect><style>.saer-diagram-element {
  font-family: "Liberation Sans";
}
.saer-diagram-shape {
  fill: #FAF8F2;
  stroke: #38342E;
  stroke-width: 2;
}
.saer-diagram-actor {
  fill: #EAE5DA;
}
.saer-diagram-process {
  fill: #E7E9E1;
}
.saer-diagram-store {
  fill: none;
  stroke-width: 2.5;
}
.saer-diagram-boundary-box,
.saer-diagram-boundary-curve {
  fill: none;
  stroke: #6B655C;
  stroke-width: 2;
  stroke-dasharray: 8 6;
}
.saer-diagram-note-frame {
  fill: none;
}
.saer-diagram-label {
  fill: #38342E;
  font-size: 10px;
  font-weight: 500;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-note {
  fill: #6B655C;
  font-size: 12px;
  text-anchor: start;
  dominant-baseline: central;
}
.saer-diagram-flow {
  fill: none;
}
.saer-diagram-flow-arrow {
  fill: #38342E;
  stroke: none;
}
.saer-diagram-flow-label {
  fill: #6B655C;
  font-size: 10px;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-flow-backing {
  fill: #F9F6F0;
  stroke: none;
}
.saer-diagram-out-of-scope .saer-diagram-shape {
  stroke: #6B655C;
  stroke-dasharray: 0 5;
  stroke-linecap: round;
}
.saer-diagram-out-of-scope .saer-diagram-flow-arrow {
  fill: #6B655C;
}
.saer-diagram-badge {
  stroke: #FAF8F2;
  stroke-width: 3;
}
.saer-diagram-badge-count {
  fill: #FAF8F2;
  stroke: none;
  font-weight: 600;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-badge-primary .saer-diagram-badge-count {
  font-size: 11px;
}
.saer-diagram-badge-secondary .saer-diagram-badge-count {
  font-size: 9px;
}
.saer-diagram-badge-mark {
  fill: #FAF8F2;
  stroke: none;
  font-size: 9px;
  font-weight: 700;
  text-anchor: middle;
  dominant-baseline: central;
}
.saer-diagram-badge-flag {
  stroke-linejoin: round;
}
.saer-diagram-tone-critical {
  fill: #C14339;
}
.saer-diagram-tone-high {
  fill: #A85E1D;
}
.saer-diagram-tone-medium {
  fill: #46788A;
}
.saer-diagram-tone-low {
  fill: #4B6B50;
}
.saer-diagram-tone-neutral {
  fill: #756E63;
}
.saer-diagram-tone-flag {
  fill: #38342E;
}

.saer-diagram-accent-1 .saer-diagram-shape {
  stroke: #AA6A89;
}
.saer-diagram-accent-1 .saer-diagram-flow-arrow,
.saer-diagram-accent-1 .saer-diagram-note-bar {
  fill: #AA6A89;
}
.saer-diagram-accent-1 .saer-diagram-tinted {
  fill: #EDE1E1;
}
.saer-diagram-accent-2 .saer-diagram-shape {
  stroke: #9370CE;
}
.saer-diagram-accent-2 .saer-diagram-flow-arrow,
.saer-diagram-accent-2 .saer-diagram-note-bar {
  fill: #9370CE;
}
.saer-diagram-accent-2 .saer-diagram-tinted {
  fill: #EAE2EC;
}
.saer-diagram-accent-3 .saer-diagram-shape {
  stroke: #93814F;
}
.saer-diagram-accent-3 .saer-diagram-flow-arrow,
.saer-diagram-accent-3 .saer-diagram-note-bar {
  fill: #93814F;
}
.saer-diagram-accent-3 .saer-diagram-tinted {
  fill: #EAE5D8;
}
.saer-diagram-accent-4 .saer-diagram-shape {
  stroke: #5C8A8F;
}
.saer-diagram-accent-4 .saer-diagram-flow-arrow,
.saer-diagram-accent-4 .saer-diagram-note-bar {
  fill: #5C8A8F;
}
.saer-diagram-accent-4 .saer-diagram-tinted {
  fill: #E1E6E2;
}
.saer-diagram-store-band,
.saer-diagram-note-ground {
  stroke: none;
}
.saer-diagram-accent-strong .saer-diagram-note {
  fill: #38342E;
}
.saer-diagram-accent-strong .saer-diagram-shape {
  stroke-width: 3;
}
.saer-diagram-accent-strong .saer-diagram-boundary-box,
.saer-diagram-accent-strong .saer-diagram-boundary-curve {
  stroke-width: 3.5;
}
.saer-diagram-accent-strong .saer-diagram-flow {
  stroke-width: 4;
}
.saer-diagram-out-of-scope.saer-diagram-accent-strong .saer-diagram-shape {
  stroke-dasharray: 0 7.5;
}
.saer-diagram-out-of-scope.saer-diagram-accent-strong .saer-diagram-boundary-box,
.saer-diagram-out-of-scope.saer-diagram-accent-strong .saer-diagram-boundary-curve {
  stroke-dasharray: 0 8.75;
}
.saer-diagram-out-of-scope.saer-diagram-accent-strong .saer-diagram-flow {
  stroke-dasharray: 0 10;
}
.saer-diagram-out-of-scope .saer-diagram-shape.saer-diagram-note-frame {
  stroke: #6B655C;
  stroke-width: 2;
  stroke-dasharray: 0 5;
}

.saer-diagram-away-frame {
  fill: #F9F6F0;
  stroke: #6B655C;
  stroke-width: 2;
  stroke-dasharray: 4 3;
}

.saer-diagram-tone-low { fill: #4B6B50; stroke: #4B6B50; stroke-width: 3; }
.saer-diagram-tone-low ~ .saer-diagram-badge-count, .saer-diagram-tone-low ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-medium { fill: #46788A; stroke: #46788A; stroke-width: 3; }
.saer-diagram-tone-medium ~ .saer-diagram-badge-count, .saer-diagram-tone-medium ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-high { fill: #A85E1D; stroke: #A85E1D; stroke-width: 3; }
.saer-diagram-tone-high ~ .saer-diagram-badge-count, .saer-diagram-tone-high ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-critical { fill: #C14339; stroke: #C14339; stroke-width: 3; }
.saer-diagram-tone-critical ~ .saer-diagram-badge-count, .saer-diagram-tone-critical ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-neutral { fill: #756E63; stroke: #756E63; stroke-width: 3; }
.saer-diagram-tone-neutral ~ .saer-diagram-badge-count, .saer-diagram-tone-neutral ~ .saer-diagram-badge-mark { fill: #FAF8F2; }
.saer-diagram-tone-flag { fill: #38342E; stroke: #38342E; stroke-width: 3; }
.saer-diagram-tone-flag ~ .saer-diagram-badge-count, .saer-diagram-tone-flag ~ .saer-diagram-badge-mark { fill: #FAF8F2; }</style><g transform="translate(380, 140)"><g class="saer-diagram-element"><rect class="saer-diagram-shape saer-diagram-boundary-box" width="240" height="140"></rect><text class="saer-diagram-label" x="120" y="11"><tspan x="120" dy="0">Payments zone</tspan></text></g></g><g transform="translate(40, 180)"><g class="saer-diagram-element"><rect class="saer-diagram-shape saer-diagram-actor" width="120" height="60"></rect><text class="saer-diagram-label" x="60" y="30"><tspan x="60" dy="0">Customer</tspan></text></g></g><g transform="translate(200, 180)"><g class="saer-diagram-element"><ellipse class="saer-diagram-shape saer-diagram-process" cx="70" cy="30" rx="70" ry="30"></ellipse><text class="saer-diagram-label" x="70" y="30"><tspan x="70" dy="0">Web app</tspan></text></g></g><g transform="translate(420, 180)"><g class="saer-diagram-element saer-diagram-accent-1 saer-diagram-accent-strong"><ellipse class="saer-diagram-shape saer-diagram-process saer-diagram-tinted" cx="70" cy="30" rx="70" ry="30"></ellipse><text class="saer-diagram-label" x="70" y="30"><tspan x="70" dy="0">Payments API</tspan></text><g class="saer-diagram-badge" transform="translate(140, 0)"><g class="saer-diagram-badge-primary"><circle class="saer-diagram-tone-high" r="13"></circle><text class="saer-diagram-badge-count" y="-3">1</text><text class="saer-diagram-badge-mark" y="7.5">H</text></g></g></g></g><g transform="translate(40, 320)"><g class="saer-diagram-element"><text class="saer-diagram-note" x="6" y="13.5"><tspan x="6" dy="0">Shared elements stand on both</tspan><tspan x="6" dy="15">diagrams.</tspan></text></g></g><g class="saer-diagram-element"><path class="saer-diagram-shape saer-diagram-flow" d="M 160 210 L 200 210"></path><path class="saer-diagram-flow-arrow" d="M 200 210 L 182 217 L 182 203 Z"></path><rect class="saer-diagram-flow-backing" x="160.75" y="176" width="46.5" height="18"></rect><text class="saer-diagram-flow-label" x="184" y="185"><tspan x="184" dy="0">Sign in</tspan></text></g><g class="saer-diagram-element"><path class="saer-diagram-shape saer-diagram-flow" d="M 340 210 L 420 210"></path><path class="saer-diagram-flow-arrow" d="M 420 210 L 402 217 L 402 203 Z"></path><rect class="saer-diagram-flow-backing" x="332.75" y="163.5" width="46.5" height="30.5"></rect><text class="saer-diagram-flow-label" x="356" y="172.5"><tspan x="356" dy="0">Card</tspan><tspan x="356" dy="12.5">details</tspan></text></g><g class="saer-diagram-element"><path class="saer-diagram-shape saer-diagram-flow" d="M 560 210 L 680 210"></path><path class="saer-diagram-flow-arrow" d="M 680 210 L 662 217 L 662 203 Z"></path><rect class="saer-diagram-flow-backing" x="620.5" y="166" width="71" height="34"></rect><g class="saer-diagram-badge" transform="translate(637.5, 183)"><g class="saer-diagram-badge-primary"><circle class="saer-diagram-tone-medium" r="13"></circle><text class="saer-diagram-badge-count" y="-3">1</text><text class="saer-diagram-badge-mark" y="7.5">M</text></g></g><text class="saer-diagram-flow-label" x="671" y="183"><tspan x="671" dy="0">Charge</tspan></text></g><g class="saer-diagram-element"><g><rect class="saer-diagram-away-frame" x="680" y="199" width="67" height="22"></rect><text class="saer-diagram-label" x="713.5" y="210"><tspan x="713.5" dy="0">Card vault</tspan></text></g></g></svg>
