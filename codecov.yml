# Reviewed-in-repo statuses replacing Codecov's defaults (issue #14).
coverage:
  status:
    # The required codecov/project check: auto target with a 1% threshold, so
    # it stays meaningful without blocking placeholder churn.
    project:
      default:
        target: auto
        threshold: 1%
    # Informational, not required: a red patch is a mandatory look for the
    # reviewer, not a mandatory fix. The checks that block a merge are listed
    # in .agents/orchestration.md's Gating CI section. 90%, not 100%: the
    # model package covers every line it has today, so the floor catches a
    # real regression while leaving room for the occasional line a test
    # cannot reach, rather than turning each PR into a coverage negotiation.
    patch:
      default:
        target: 90%
