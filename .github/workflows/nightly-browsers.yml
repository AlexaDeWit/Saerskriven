name: Nightly browsers

# The other supported engines run outside the PR gate (#679).
on:
  schedule:
    # Off the hour, where GitHub's scheduled-run backlog is deepest.
    - cron: '23 4 * * *'
  workflow_dispatch:

# Main runs wait. A newer manual branch run replaces the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  pnpm_config_store_dir: ${{ github.workspace }}/.pnpm-store

jobs:
  browsers:
    name: Browser suite (${{ matrix.engine }}, ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ci.yml owns cache writes. Nightly jobs only restore its entries.
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          install-dependencies: 'true'
          save-nix-store: 'false'

      # The nightly shell adds the Mesa EGL driver WebKit needs off NixOS.
      # One worker per host retains each test's existing deadline.
      - name: Run the suite in this engine
        env:
          ENGINE: ${{ matrix.engine }}
          SHARD_INDEX: ${{ matrix.shard }}
          SAERSKRIVEN_E2E_OTHER_ENGINES: '1'
        run: >-
          nix develop .#nightly --command
          pnpm nx e2e @saerskriven/studio-e2e --
          --project="$ENGINE" --no-deps
          --workers=1 --shard="$SHARD_INDEX/2" --retries=0

      - name: Keep the blob report of this shard
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-blob-${{ matrix.engine }}-shard-${{ matrix.shard }}
          path: apps/studio-e2e/test-output/playwright/blob/
          if-no-files-found: error
          retention-days: 1

      # A timeout can leave output without a completed blob report.
      - name: Keep the Playwright output of a failed run
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-output-${{ matrix.engine }}-shard-${{ matrix.shard }}
          path: apps/studio-e2e/test-output/playwright/output/
          if-no-files-found: ignore
          retention-days: 14

  merge:
    name: Merged nightly report (${{ matrix.engine }})
    needs: browsers
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          install-dependencies: 'true'
          save-nix-store: 'false'

      - name: Take the first shard report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playwright-blob-${{ matrix.engine }}-shard-1
          path: ${{ runner.temp }}/nightly-blobs/shard-1

      - name: Take the second shard report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playwright-blob-${{ matrix.engine }}-shard-2
          path: ${{ runner.temp }}/nightly-blobs/shard-2

      - name: Require one blob from each shard
        env:
          BLOB_ROOT: ${{ runner.temp }}/nightly-blobs
        run: |
          shopt -s nullglob dotglob
          destination=apps/studio-e2e/test-output/playwright/blob
          mkdir -p "$destination"
          for shard in 1 2; do
            blobs=("$BLOB_ROOT/shard-$shard"/*)
            if [[ ${#blobs[@]} != 1 || ! -f ${blobs[0]} || ${blobs[0]} != *.zip ]]; then
              echo "Expected exactly one blob ZIP from shard $shard" >&2
              exit 1
            fi
            cp "${blobs[0]}" "$destination/shard-$shard.zip"
          done

      - name: Write the HTML and JSON reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: test-output/playwright/report
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-output/playwright/json/${{ matrix.engine }}.json
        run: >-
          nix develop .#ci --command
          pnpm --filter @saerskriven/studio-e2e exec
          playwright merge-reports --reporter html,json
          test-output/playwright/blob

      - name: Keep the HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.engine }}
          path: apps/studio-e2e/test-output/playwright/report/
          if-no-files-found: error
          retention-days: 14

      - name: Hand the JSON report to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-json-${{ matrix.engine }}
          path: apps/studio-e2e/test-output/playwright/json/
          if-no-files-found: error
          retention-days: 1

  # Only main updates the tracker. Cancelled runs leave it unchanged.
  report:
    name: Update the nightly tracker
    needs: [browsers, merge]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # open, comment on or close the tracking issue
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Artifacts stay outside the checkout containing the privileged script.
      - name: Take the Firefox JSON report
        id: firefox-report
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playwright-json-firefox
          path: ${{ runner.temp }}/nightly-reports

      - name: Take the WebKit JSON report
        id: webkit-report
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playwright-json-webkit
          path: ${{ runner.temp }}/nightly-reports

      # The job with issue write permission installs nothing.
      - name: Update the tracking issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BROWSERS_RESULT: ${{ needs.browsers.result }}
          MERGE_RESULT: ${{ needs.merge.result }}
          REPORTS_RESULT: ${{ steps.firefox-report.outcome == 'success' && steps.webkit-report.outcome == 'success' && 'success' || 'failure' }}
        run: bash scripts/nightly/report.sh "$RUNNER_TEMP/nightly-reports" firefox webkit
